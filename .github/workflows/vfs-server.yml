name: VFS_SERVER qualification
on:
  workflow_dispatch:
  push:
    paths:
      - 'vfs_server/**'
      - '.github/workflows/vfs-server.yml'
  pull_request:
    paths:
      - 'vfs_server/**'
      - '.github/workflows/vfs-server.yml'
permissions:
  contents: read
concurrency:
  group: vfs-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q vfs_server
      - name: Unit qualification
        run: python -m unittest discover -s vfs_server/tests -v
