name: BRAINK ring authorization regression
on:
  pull_request:
    paths:
      - 'braink/core/rings.py'
      - 'braink/runtime/executor.py'
      - 'braink/domain/engine.py'
      - 'tests/unit/test_ring_authorization_matrix.py'
      - '.github/workflows/ring-authorization.yml'
  push:
    paths:
      - 'braink/core/rings.py'
      - 'braink/runtime/executor.py'
      - 'braink/domain/engine.py'
      - 'tests/unit/test_ring_authorization_matrix.py'
      - '.github/workflows/ring-authorization.yml'
jobs:
  authorization:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests/unit/test_rings.py tests/unit/test_ring_authorization_matrix.py -q
