[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "braink-cli-node"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["braink-node-core==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
braink-node = "braink_cli.cli:main"
